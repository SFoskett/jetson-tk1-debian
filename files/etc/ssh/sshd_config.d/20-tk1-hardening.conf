# SSH hardening for the TK1 image. OpenSSH uses the first value it reads
# for each setting, and these files are read before /etc/ssh/sshd_config,
# so they take precedence over Debian's defaults there.

# No root logins; use the default user and sudo.
PermitRootLogin no

# Limit guessing and abandoned connections.
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Local TCP forwarding stays on because ProxyJump (ssh -J) needs it.
# Everything else that forwards or tunnels is off.
AllowTcpForwarding local
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no

# Do not advertise the Debian package version to connecting clients.
DebianBanner no

#!/usr/sbin/nft -f
# Default-deny firewall for the TK1 image. Incoming connections are
# dropped unless a rule below accepts them. SSH is the only service
# allowed by default. To allow another service, add a rule in the marked
# section of the input chain, then apply it with:
#     sudo systemctl reload nftables
#
# Loading this file replaces only the tk1 table below. Rules that other
# software adds for itself, such as Tailscale or Docker, live in their own
# tables and are left alone. A packet must be accepted by every table it
# passes through, so this table still decides what reaches the board.

# Create the table if it does not exist, then delete it, so the definition
# below always starts from scratch.
table inet tk1
delete table inet tk1

table inet tk1 {
	chain input {
		type filter hook input priority filter; policy drop;

		# Replies to connections this board started, and loopback.
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept

		# ICMP, which IPv6 needs for neighbor discovery, and DHCPv6
		# replies, which conntrack cannot match to their requests.
		ip protocol icmp accept
		meta l4proto ipv6-icmp accept
		ip6 saddr fe80::/10 udp dport 546 accept

		# SSH.
		tcp dport 22 accept

		# Add rules for other services here. Examples:
		#     tcp dport 3493 accept             NUT server
		#     udp dport 40000 accept            Tailscale peer relay
		#     udp dport 41641 accept            Tailscale direct connections
		#     iifname "tailscale0" accept       everything from your tailnet
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		# To route for other devices, such as a Tailscale subnet router or
		# exit node, allow forwarding here, for example:
		#     iifname "tailscale0" accept
		#     oifname "tailscale0" ct state established,related accept
		# and enable IP forwarding with sysctl.
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

#!/usr/sbin/nft -f
# Default-deny firewall for the TK1 image. Incoming connections are
# dropped unless a rule below accepts them. SSH is the only service
# allowed by default. To allow another service, add a rule in the marked
# section of the input chain, for example for a NUT server:
#     tcp dport 3493 accept
# then apply it with: sudo systemctl reload nftables

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		# Replies to connections this board started, and loopback.
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept

		# ICMP, which IPv6 needs for neighbor discovery, and DHCPv6
		# replies, which conntrack cannot match to their requests.
		ip protocol icmp accept
		meta l4proto ipv6-icmp accept
		ip6 saddr fe80::/10 udp dport 546 accept

		# SSH.
		tcp dport 22 accept

		# Add rules for other services here.
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
